name: CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: powershell -NoProfile -File tests/deployment/run-coverage.ps1
      - run: pnpm quality:smells
      - run: pnpm build
      - run: powershell -NoProfile -File deploy/test-desktop.ps1
      - run: pwsh -NoProfile -File deploy/test-desktop.ps1
      - run: pnpm exec playwright install chromium
      - run: pnpm sample
      - run: pnpm e2e --update-snapshots=none
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-source-coverage
          path: |
            coverage/
            coverage-deployment/
          retention-days: 7