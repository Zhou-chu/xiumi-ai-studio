name: CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-unit:
    uses: ./.github/workflows/strict-unit-stage.yml
  verify:
    name: Verify Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - name: Audit Cloud source and test classification
        run: node --test tests/quality/sonar-scope.test.mjs
      - run: pnpm check
      - name: Legacy full-source coverage (mixed layers)
        run: pnpm test:coverage
      - run: pnpm quality:smells
      - name: Isolated Windows deployment coverage
        run: powershell -NoProfile -File tests/deployment/run-coverage.ps1
      - run: pnpm build
      - name: Windows PowerShell deployment guard (disposable data)
        run: powershell -NoProfile -File deploy/test-desktop.ps1
      - name: PowerShell Core deployment guard (disposable data)
        run: pwsh -NoProfile -File deploy/test-desktop.ps1
      - run: pnpm exec playwright install chromium
      - run: pnpm sample
      - run: pnpm e2e --update-snapshots=none
        env:
          XIUMI_RESPONSIVE_COMBINATION: '1'
      - name: Editorial shell dark and responsive scenarios
        run: pnpm exec playwright test --config playwright.shell.config.ts --update-snapshots=none
        env:
          SHELL_PHASE: 'after'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
            visual-evidence/model-picker/
            test-results-shell/
            visual-evidence/editorial-shell/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-coverage-node-${{ matrix.node }}
          path: |
            coverage/
            coverage-deployment/
          retention-days: 7
