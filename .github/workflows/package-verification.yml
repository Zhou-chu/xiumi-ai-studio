name: Isolated Windows package verification
on:
  push:
    branches: ['fix/upstream-package-verification-20261114']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm sample
      - run: pnpm package:win
      - name: Record exact built artifact identity
        shell: pwsh
        run: |
          Get-ChildItem release/*.zip | Get-FileHash -Algorithm SHA256 | ConvertTo-Json | Set-Content release/package-sha256.json
      - run: pnpm verify:package
      - run: pnpm exec playwright install chromium
      - run: pnpm e2e:package --update-snapshots=none
        env:
          XIUMI_RESPONSIVE_COMBINATION: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: isolated-package-verification
          path: |
            release/verify-report.md
            release/package-sha256.json
            playwright-report/
            test-results/
            visual-evidence/model-picker/
          retention-days: 7
