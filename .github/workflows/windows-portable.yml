name: Windows portable package
on:
  push:
    branches: [main, 'fix/windows-portable*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.23.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/deployment/portable-bundle.test.mjs tests/deployment/project-backup-restore.test.mjs
      - run: pnpm build
      - name: Build and seal actual Windows EXE and ZIP
        shell: pwsh
        run: ./deploy/portable/package.ps1 -ExpectedSha $env:EXPECTED_SHA -OutputDirectory (Join-Path $env:RUNNER_TEMP 'xiumi-portable-release')
      - run: pnpm exec playwright install chromium
      - name: Exercise the exact unpacked Windows EXE
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'xiumi-portable-release'
          $receipt = Get-Content -LiteralPath (Join-Path $output 'receipt.json') -Raw | ConvertFrom-Json
          $archive = Join-Path $output 'XIUMI-AI-Studio-win-x64.zip'
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.commit -cne $env:EXPECTED_SHA -or $receipt.archiveSha256 -cne $hash) { throw 'Candidate archive identity mismatch.' }
          $unpack = Join-Path $env:RUNNER_TEMP 'xiumi portable smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpack
          $env:XIUMI_PORTABLE_ROOT = Join-Path $unpack 'XIUMI-AI-Studio-win-x64'
          $env:XIUMI_PORTABLE_EXPECTED_SHA = $env:EXPECTED_SHA
          pnpm e2e --config=tests/release-smoke/playwright.config.ts --update-snapshots=none
          if ($LASTEXITCODE -ne 0) { throw 'Windows portable Playwright smoke failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiumi-portable-win-x64-${{ env.EXPECTED_SHA }}
          path: |
            ${{ runner.temp }}/xiumi-portable-release/XIUMI-AI-Studio-win-x64.zip
            ${{ runner.temp }}/xiumi-portable-release/SHA256SUMS.txt
            ${{ runner.temp }}/xiumi-portable-release/receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: xiumi-portable-playwright-failure
          path: |
            playwright-report/release-smoke/
            test-results/release-smoke/
          if-no-files-found: ignore
          retention-days: 7
