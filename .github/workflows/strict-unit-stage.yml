name: Strict unit staging gate
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Keep manually dispatched runs independent of calls from CI.
  group: strict-unit-stage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  strict-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XIUMI_SKIP_ENV_FILES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.6.0
      - run: pnpm install --frozen-lockfile
      - run: node tests/quality/test-layer-check.mjs
      - run: pnpm exec vitest run --config vitest.unit.config.ts --coverage
        env:
          DATA_DIR: ${{ runner.temp }}/xiumi-strict-data
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: strict-unit-stage-coverage
          path: coverage-unit-diagnostic/
          retention-days: 7
