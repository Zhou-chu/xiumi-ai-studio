# Automatic analysis reads this file, not sonar-project.properties.
# Enumerate every tracked top-level entry except tests, including deploy and scripts.
sonar.sources=.claude,.env.example,.gitattributes,.github,.gitignore,.sonarcloud.properties,DESIGN.md,README.md,THIRD_PARTY_NOTICES.md,deploy,docs,eslint.config.js,eslint.quality.config.js,index.html,package.json,playwright.config.ts,playwright.live.config.ts,pnpm-lock.yaml,pnpm-workspace.yaml,samples,scripts,server,src,start.bat,templates,tsconfig.json,visual-evidence,vite.config.ts,vitest.coverage.config.ts,vitest.scripts.coverage.config.ts
sonar.tests=tests,deploy/test-desktop.ps1
# This file is still analyzed as TEST, not omitted from analysis.
sonar.exclusions=deploy/test-desktop.ps1
sonar.sourceEncoding=UTF-8
